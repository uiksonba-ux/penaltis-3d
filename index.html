<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pênaltis 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091b20;color:#fff;font:600 15px system-ui,Arial;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block;touch-action:none}header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:linear-gradient(#061a23dd,transparent);pointer-events:none}h1{font-size:17px;margin:0;letter-spacing:1px}.score{font-size:20px;background:#001923aa;padding:7px 12px;border-radius:12px}.round{font-size:12px;color:#c4e8f0}#panel{position:fixed;bottom:0;left:0;right:0;padding:14px 12px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#071820 25%);text-align:center}#message{font-size:17px;min-height:28px;text-shadow:0 2px 4px #000}#choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;max-width:690px;margin:9px auto 0}button{border:1px solid #7dcbd5;background:#123e4c;color:white;border-radius:12px;padding:12px 3px;font:700 12px system-ui;cursor:pointer;min-height:57px}button:active{transform:scale(.97);background:#287888}button:disabled{opacity:.4}#restart{display:none;background:#f4bf3c;color:#142027;padding:12px 22px;min-height:42px;border:0;margin:12px auto}#hint{font-size:11px;color:#a9c6c7;margin-top:8px}#loading{position:fixed;inset:0;background:#071820;display:grid;place-items:center;z-index:10}#loading.hidden{display:none}@media(max-width:390px){button{font-size:10px;padding:10px 1px}h1{font-size:14px}}
</style></head><body><div id="loading">Carregando estádio 3D...</div><div id="game"></div><header><div><h1>⚽ PÊNALTIS 3D</h1><div class="round" id="round">Rodada 1 de 5</div></div><div class="score" id="score">VOCÊ 0 × 0 CPU</div></header><div id="panel"><div id="message" role="status">Escolha onde chutar!</div><div id="choices"><button data-zone="0">↖<br>Alto Esq.</button><button data-zone="1">↗<br>Alto Dir.</button><button data-zone="2">↙<br>Baixo Esq.</button><button data-zone="3">↘<br>Baixo Dir.</button><button data-zone="4">⬆<br>Centro</button></div><button id="restart">JOGAR NOVAMENTE</button><div id="hint">Toque em uma direção: o chute é automático.</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const container=document.querySelector('#game'), scene=new THREE.Scene();scene.background=new THREE.Color(0x102236);scene.fog=new THREE.Fog(0x17283b,55,140);
const camera=new THREE.PerspectiveCamera(57,innerWidth/innerHeight,.1,150);camera.position.set(0,2.45,10.5);camera.lookAt(0,1.7,-9);
const renderer=new THREE.WebGLRenderer({antialias:devicePixelRatio<2,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;container.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f6ff,0x34502d,2.0));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-7,15,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);const fill=new THREE.DirectionalLight(0xb5d9ff,1.3);fill.position.set(8,11,-17);scene.add(fill);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
// Dense stylized 3D turf inspired by the reference: pointed blades and vivid green variation.
const turfCanvas=document.createElement('canvas');turfCanvas.width=512;turfCanvas.height=512;
const ctx=turfCanvas.getContext('2d');ctx.fillStyle='#2d6812';ctx.fillRect(0,0,512,512);
let seed=93123;const rng=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
for(let i=0;i<16000;i++){const x=rng()*530-9,y=rng()*530-9,h=7+rng()*21,w=1.3+rng()*3.7,lean=(rng()-.5)*12;
const hue=79+rng()*31,light=21+rng()*30;ctx.fillStyle='hsl('+hue+', '+(67+rng()*26)+'%, '+light+'%)';
ctx.beginPath();ctx.moveTo(x-w,y+3);ctx.quadraticCurveTo(x+lean*.28,y-h*.5,x+lean,y-h);ctx.quadraticCurveTo(x+lean*.25+w,y-h*.4,x+w,y+3);ctx.fill();}
const turfTexture=new THREE.CanvasTexture(turfCanvas);turfTexture.wrapS=turfTexture.wrapT=THREE.RepeatWrapping;turfTexture.repeat.set(4,6);turfTexture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());turfTexture.colorSpace=THREE.SRGBColorSpace;
const grass=new THREE.MeshStandardMaterial({map:turfTexture,color:0xffffff,roughness:1}),white=mat(0xf5f5ec),blue=mat(0x2265a3),skin=mat(0xe1ad82),dark=mat(0x222c3c),net=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.23,side:THREE.DoubleSide});
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.receiveShadow=true;o.castShadow=true;scene.add(o);return o}
box(65,.16,80,grass,0,-.11,-12);
// Lightweight real blade silhouettes near the penalty spot, using one instanced draw call.
const bladeGeo=new THREE.BufferGeometry();bladeGeo.setAttribute('position',new THREE.Float32BufferAttribute([-.043,0,0,.043,0,0,.0,.24,0],3));bladeGeo.computeVertexNormals();
const bladeMat=new THREE.MeshStandardMaterial({color:0xffffff,side:THREE.DoubleSide,roughness:1,vertexColors:false});
const blades=new THREE.InstancedMesh(bladeGeo,bladeMat,9500);const dummy=new THREE.Object3D();
for(let i=0;i<9500;i++){dummy.position.set((rng()-.5)*25,.025,-17+rng()*30);dummy.rotation.set(0,rng()*Math.PI*2,(rng()-.5)*.45);const sc=.20+rng()*.20;dummy.scale.set(sc,sc,sc);dummy.updateMatrix();blades.setMatrixAt(i,dummy.matrix);blades.setColorAt(i,new THREE.Color().setHSL(.23+rng()*.08,.65,.25+rng()*.2));}
blades.instanceMatrix.needsUpdate=true;scene.add(blades);
function line(x1,z1,x2,z2){const dx=x2-x1,dz=z2-z1,o=box(Math.hypot(dx,dz),.012,.09,white,(x1+x2)/2,.02,(z1+z2)/2);o.rotation.y=-Math.atan2(dz,dx)}
line(-10,-13,10,-13);line(-10,-13,-10,-3);line(10,-13,10,-3);line(-10,-3,10,-3);
const goalZ=-12,goalW=7.3,goalH=2.7;
box(.13,goalH,.13,white,-goalW/2,goalH/2,goalZ);box(.13,goalH,.13,white,goalW/2,goalH/2,goalZ);box(goalW+.15,.13,.13,white,0,goalH,goalZ);
const netPlane=new THREE.Mesh(new THREE.PlaneGeometry(goalW,goalH,24,9),net);netPlane.position.set(0,goalH/2,goalZ-.8);scene.add(netPlane);
for(let x=-goalW/2;x<=goalW/2+.01;x+=.35)box(.012,goalH,.012,net,x,goalH/2,goalZ-.78);
for(let y=0;y<=goalH+.01;y+=.27)box(goalW,.012,.012,net,0,y,goalZ-.78);
for(let side of [-1,1]){box(.05,goalH,.05,white,side*goalW/2,goalH/2,goalZ-.8);box(.05,.05,.8,white,side*goalW/2,goalH,goalZ-.4)}
// Stadium stands, floodlights, crowd and advertising hoardings
const standMat=mat(0x263445),seatColors=[0x173f61,0x2e5d81,0xbfc8d1,0x9c2834,0x1a324c];
for(let row=0;row<10;row++){const z=-22-row*1.5;box(75,1.15,1.6,mat(row%2?0x263747:0x1b2c3e),0,1.2+row*1.1,z);for(let j=0;j<100;j++){const x=(j-49.5)*.7;const seat=new THREE.Mesh(new THREE.BoxGeometry(.35,.38,.23),mat(seatColors[(j*13+row*7)%seatColors.length]));seat.position.set(x,2.15+row*1.1,z);scene.add(seat)}} 
for(let side of [-1,1]){for(let row=0;row<8;row++){box(2,1.1,52,standMat,side*(20+row*1.4),1.2+row*1.1,-10);}}
for(let x of [-16,16]){box(.27,17,.27,mat(0x8d9ba5),x,8.5,-19);const flood=new THREE.PointLight(0xe2f0ff,26,42);flood.position.set(x,17,-19);scene.add(flood);box(4,.9,.4,mat(0xeef5ff),x,17,-19)}
for(let x=-10;x<=10;x+=4){box(3.85,.9,.12,mat(x%8===0?0x0b668b:0x182f55),x,.5,-16)}
// Penalty spot and grass mowing details
const spot=new THREE.Mesh(new THREE.CircleGeometry(.1,16),white);spot.rotation.x=-Math.PI/2;spot.position.set(0,.034,3.5);scene.add(spot);

const keeper=new THREE.Group();scene.add(keeper);
function part(geometry,m,x,y,z,group=keeper){const o=new THREE.Mesh(geometry,m);o.position.set(x,y,z);o.castShadow=true;group.add(o);return o}
// Human-proportioned goalkeeper with shirt, shorts, socks, boots, hair and gloves
const jersey=mat(0x16a4a0),shorts=mat(0x182331),socks=mat(0x12a19a),boots=mat(0x10151a),gloves=mat(0xe6edeb),hair=mat(0x241b19);
part(new THREE.CapsuleGeometry(.34,.55,8,16),jersey,0,1.43,0);
part(new THREE.CapsuleGeometry(.21,.16,6,12),shorts,-.19,.93,0);part(new THREE.CapsuleGeometry(.21,.16,6,12),shorts,.19,.93,0);
part(new THREE.SphereGeometry(.225,18,14),skin,0,2.21,0);
part(new THREE.SphereGeometry(.228,18,14,0,Math.PI*2,0,Math.PI*.43),hair,0,2.28,0);
for(const sign of [-1,1]){part(new THREE.CapsuleGeometry(.12,.46,6,12),socks,sign*.19,.43,0);part(new THREE.BoxGeometry(.25,.15,.39),boots,sign*.19,.12,.13)}
const arms=[part(new THREE.CapsuleGeometry(.125,.58,8,12),jersey,-.54,1.58,0),part(new THREE.CapsuleGeometry(.125,.58,8,12),jersey,.54,1.58,0)];
arms[0].rotation.z=-.72;arms[1].rotation.z=.72;
part(new THREE.SphereGeometry(.15,12,10),gloves,-.85,1.82,.06);part(new THREE.SphereGeometry(.15,12,10),gloves,.85,1.82,.06);
const jerseyNumber=part(new THREE.BoxGeometry(.24,.29,.012),white,0,1.5,-.33);
keeper.position.set(0,0,goalZ+.6);
// Yellow match ball with red and navy curved panel motifs, inspired by the reference.
const ballCanvas=document.createElement('canvas');ballCanvas.width=1024;ballCanvas.height=512;
const bc=ballCanvas.getContext('2d');bc.fillStyle='#ffd32b';bc.fillRect(0,0,1024,512);
for(let row=0;row<3;row++){for(let col=0;col<6;col++){
const cx=col*180+(row%2)*90-45,cy=85+row*170;
bc.save();bc.translate(cx,cy);bc.rotate((col+row)*.75);
for(let arm=0;arm<3;arm++){bc.save();bc.rotate(arm*Math.PI*2/3);
bc.beginPath();bc.moveTo(-12,-9);bc.bezierCurveTo(-16,-43,-27,-65,-35,-78);bc.lineTo(-15,-75);bc.bezierCurveTo(-1,-51,4,-28,9,-10);bc.closePath();bc.fillStyle='#b71821';bc.fill();
bc.beginPath();bc.moveTo(-7,-12);bc.bezierCurveTo(-11,-42,-18,-61,-23,-70);bc.strokeStyle='#20213b';bc.lineWidth=5;bc.stroke();
bc.beginPath();bc.moveTo(13,-12);bc.bezierCurveTo(19,-36,22,-52,25,-62);bc.strokeStyle='#f47924';bc.lineWidth=5;bc.stroke();bc.restore();}
bc.restore();}}
bc.strokeStyle='rgba(116,82,20,.23)';bc.lineWidth=2;for(let y=0;y<512;y+=85){bc.beginPath();bc.moveTo(0,y);for(let x=0;x<=1024;x+=8)bc.lineTo(x,y+7*Math.sin(x/42+y));bc.stroke();}
const ballTexture=new THREE.CanvasTexture(ballCanvas);ballTexture.colorSpace=THREE.SRGBColorSpace;ballTexture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const ballGroup=new THREE.Group();scene.add(ballGroup);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.23,48,32),new THREE.MeshStandardMaterial({map:ballTexture,roughness:.43,metalness:0}));ball.castShadow=true;ballGroup.add(ball);
const ballStart=new THREE.Vector3(0,.23,3.5);ballGroup.position.copy(ballStart);
const zones=[[-2.7,2.2],[2.7,2.2],[-2.7,.45],[2.7,.45],[0,1.3]];
let turn='kick',kickCount=0,saveCount=0,player=0,cpu=0,busy=false,animation=null;
const message=document.querySelector('#message'),score=document.querySelector('#score'),round=document.querySelector('#round'),restart=document.querySelector('#restart'),buttons=[...document.querySelectorAll('[data-zone]')];
const rand=n=>Math.floor(Math.random()*n);
function update(){score.textContent='VOCÊ '+player+' × '+cpu+' CPU';round.textContent='Rodada '+Math.min(5,Math.max(kickCount,saveCount)+1)+' de 5';message.textContent=turn==='kick'?'Sua vez de CHUTAR!':'Sua vez de DEFENDER!';buttons.forEach(b=>b.disabled=busy)}
function fire(zone){if(busy||kickCount>=5&&saveCount>=5)return;busy=true;buttons.forEach(b=>b.disabled=true);
const shooter=turn==='kick'?'player':'cpu';const shot=shooter==='player'?zone:rand(5);const dive=shooter==='player'?rand(5):zone;const success=shot!==dive;
const target=zones[shot];animation={start:performance.now(),duration:1350,shot,dive,target,success,shooter,handled:false};
message.textContent=shooter==='player'?'⚽ Chutando...':'🧤 Defendendo...';
}
buttons.forEach(b=>b.addEventListener('click',()=>fire(Number(b.dataset.zone))));
function endMatch(){busy=true;buttons.forEach(b=>b.disabled=true);message.textContent=player>cpu?'🏆 VOCÊ VENCEU!':player<cpu?'CPU VENCEU!':'🤝 EMPATE!';round.textContent='Fim da partida';restart.style.display='block'}
function next(){if(turn==='kick'){kickCount++;turn='save'}else{saveCount++;turn='kick'}
const leftP=5-kickCount,leftC=5-saveCount;
if(player>cpu+leftC||cpu>player+leftP||(kickCount===5&&saveCount===5)){endMatch();return}
busy=false;keeper.position.set(0,0,goalZ+.6);keeper.rotation.z=0;ballGroup.position.copy(ballStart);ballGroup.rotation.set(0,0,0);update()}
restart.addEventListener('click',()=>{kickCount=saveCount=player=cpu=0;turn='kick';busy=false;animation=null;restart.style.display='none';keeper.position.set(0,0,goalZ+.6);keeper.rotation.z=0;ballGroup.position.copy(ballStart);update()});
function animate(t){requestAnimationFrame(animate);if(animation){const a=animation,p=Math.min(1,(t-a.start)/a.duration),flight=Math.min(1,p/.76),e=1-Math.pow(1-flight,2);ballGroup.position.set(ballStart.x+(a.target[0]-ballStart.x)*e,ballStart.y+(a.target[1]-ballStart.y)*e+Math.sin(Math.PI*flight)*1.05,ballStart.z+(goalZ-.15-ballStart.z)*e);ballGroup.rotation.x+=.12;
const diveTarget=zones[a.dive];const dp=Math.min(1,Math.max(0,(p-.12)/.58));arms[0].rotation.z=-.72-.45*dp;arms[1].rotation.z=.72+.45*dp;keeper.position.x=diveTarget[0]*dp*.9;keeper.position.y=(diveTarget[1]>1.5?.5:.12)*Math.sin(dp*Math.PI*.8);keeper.rotation.z=-Math.sign(diveTarget[0])*.55*dp;
if(p>=.82&&!a.handled){a.handled=true;if(a.success){if(a.shooter==='player')player++;else cpu++}score.textContent='VOCÊ '+player+' × '+cpu+' CPU';message.textContent=a.success?'⚽ GOOOL!':'🧤 DEFENDEU!'}
if(p>=1){animation=null;setTimeout(next,650)}}
renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.position.set(0,innerWidth<innerHeight?2.7:2.45,innerWidth<innerHeight?12.3:10.5);camera.lookAt(0,1.65,-9);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
if(innerWidth<innerHeight){camera.position.set(0,2.7,12.3);camera.lookAt(0,1.65,-9)}
document.querySelector('#loading').classList.add('hidden');update();requestAnimationFrame(animate);
</script></body></html>
