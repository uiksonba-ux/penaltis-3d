<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pênaltis 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091b20;color:#fff;font:600 15px system-ui,Arial;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block;touch-action:none}header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:linear-gradient(#061a23dd,transparent);pointer-events:none}h1{font-size:17px;margin:0;letter-spacing:1px}.score{font-size:20px;background:#001923aa;padding:7px 12px;border-radius:12px}.round{font-size:12px;color:#c4e8f0}#panel{position:fixed;bottom:0;left:0;right:0;padding:14px 12px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#071820 25%);text-align:center}#message{font-size:17px;min-height:28px;text-shadow:0 2px 4px #000}#choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;max-width:690px;margin:9px auto 0}button{border:1px solid #7dcbd5;background:#123e4c;color:white;border-radius:12px;padding:12px 3px;font:700 12px system-ui;cursor:pointer;min-height:57px}button:active{transform:scale(.97);background:#287888}button:disabled{opacity:.4}#restart{display:none;background:#f4bf3c;color:#142027;padding:12px 22px;min-height:42px;border:0;margin:12px auto}#hint{font-size:11px;color:#a9c6c7;margin-top:8px}#loading{position:fixed;inset:0;background:#071820;display:grid;place-items:center;z-index:10}#loading.hidden{display:none}@media(max-width:390px){button{font-size:10px;padding:10px 1px}h1{font-size:14px}}
</style></head><body><div id="loading">Carregando estádio 3D...</div><div id="game"></div><header><div><h1>⚽ PÊNALTIS 3D</h1><div class="round" id="round">Rodada 1 de 5</div></div><div class="score" id="score">VOCÊ 0 × 0 CPU</div></header><div id="panel"><div id="message" role="status">Escolha onde chutar!</div><div id="choices"><button data-zone="0">↖<br>Alto Esq.</button><button data-zone="1">↗<br>Alto Dir.</button><button data-zone="2">↙<br>Baixo Esq.</button><button data-zone="3">↘<br>Baixo Dir.</button><button data-zone="4">⬆<br>Centro</button></div><button id="restart">JOGAR NOVAMENTE</button><div id="hint">Toque em uma direção: o chute é automático.</div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
const loading=document.getElementById('loading'),container=document.getElementById('game');
function fail(e){loading.classList.remove('hidden');loading.innerHTML='<div style="text-align:center;padding:22px">Erro ao abrir Babylon.js<p style="font-size:12px">'+String(e).replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">Tentar novamente</button></div>'}
try{
if(!window.BABYLON)throw Error('Motor Babylon.js indisponível. Verifique a internet.');
const B=BABYLON,canvas=document.createElement('canvas');canvas.style.cssText='width:100%;height:100%;display:block;touch-action:none';container.appendChild(canvas);
const engine=new B.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:false,antialias:false},false);engine.setHardwareScalingLevel(Math.max(1,Math.min(1.7,devicePixelRatio)));
const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.055,.105,.17,1);
const camera=new B.FreeCamera('camera',new B.Vector3(0,2.8,12.6),scene);camera.setTarget(new B.Vector3(0,1.5,-10));camera.fov=.95;
const hemi=new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene);hemi.intensity=.95;
const light=new B.DirectionalLight('flood',new B.Vector3(-.5,-1,.5),scene);light.intensity=1.9;
function material(name,color,roughness=1){const m=new B.PBRMaterial(name,scene);m.albedoColor=B.Color3.FromHexString(color);m.metallic=0;m.roughness=roughness;return m}
const grass=material('Natural grass','#32612e'),white=material('white lines','#f5f5ed'),navy=material('navy kit','#162e67'),red=material('burgundy stripe','#b7203c'),skin=material('skin','#b88360'),hair=material('hair','#211b17'),shorts=material('shorts','#132957'),sock=material('socks','#172f67'),shoe=material('boots','#e9e9e9'),teal=material('keeper','#168b86'),dark=material('dark','#172332');
function box(name,w,h,d,x,y,z,mat,parent){const m=B.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);m.position.set(x,y,z);m.material=mat;if(parent)m.parent=parent;return m}
function ell(name,x,y,z,sx,sy,sz,mat,parent){const m=B.MeshBuilder.CreateSphere(name,{diameter:1,segments:12},scene);m.position.set(x,y,z);m.scaling.set(sx*2,sy*2,sz*2);m.material=mat;if(parent)m.parent=parent;return m}
const ground=B.MeshBuilder.CreateGround('pitch',{width:60,height:75},scene);ground.position.z=-11;ground.material=grass;
const tex=new B.DynamicTexture('pitchTexture',{width:512,height:512},scene,false),ctx=tex.getContext();ctx.fillStyle='#396d34';ctx.fillRect(0,0,512,512);let seed=9;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}for(let i=0;i<19000;i++){const v=50+Math.floor(rand()*35);ctx.fillStyle='rgba('+Math.floor(v*.7)+','+(v+45)+','+Math.floor(v*.65)+',.28)';ctx.fillRect(rand()*512,rand()*512,1,1+rand()*3)}tex.update();tex.uScale=12;tex.vScale=14;grass.albedoTexture=tex;
function mark(x,z,w,d){box('paint',w,.012,d,x,.012,z,white)}
mark(0,-3,20,.09);mark(0,-13,20,.09);mark(-10,-8,.09,10);mark(10,-8,.09,10);
const goalZ=-12,goalW=7.3,goalH=2.65;box('goal left',.13,goalH,.13,-goalW/2,goalH/2,goalZ,white);box('goal right',.13,goalH,.13,goalW/2,goalH/2,goalZ,white);box('crossbar',goalW,.13,.13,0,goalH,goalZ,white);
const net=material('net','#b9c8c9');net.alpha=.36;for(let x=-goalW/2;x<goalW/2+.01;x+=.38)box('net vertical',.012,goalH,.012,x,goalH/2,goalZ-.8,net);for(let y=0;y<goalH+.01;y+=.32)box('net horizontal',goalW,.012,.012,0,y,goalZ-.8,net);
const stand=material('stadium','#223449');const seats=['#1c3852','#375877','#9eacb8','#752a3e'].map((c,i)=>material('seat'+i,c));
for(let r=0;r<8;r++){const z=-20-r*1.7;box('terrace',66,1,1.6,0,1+r*1.1,z,stand);for(let j=0;j<62;j++)box('crowd',.45,.3,.26,(j-30.5)*1.04,1.75+r*1.1,z,seats[(j*7+r*3)%4])}
const kicker=new B.TransformNode('kicker',scene);kicker.position.set(-.75,0,5.9);
ell('torso',0,1.5,0,.31,.47,.19,navy,kicker);box('red central band',.19,.77,.015,0,1.53,-.197,red,kicker);
ell('hips',0,1.04,0,.29,.20,.19,shorts,kicker);ell('neck',0,1.99,0,.105,.13,.10,skin,kicker);ell('head',0,2.23,0,.19,.25,.18,skin,kicker);ell('hair',0,2.43,0,.19,.07,.18,hair,kicker);
const legs=[],arms=[];
for(const sign of [-1,1]){
const a=new B.TransformNode('arm',scene);a.parent=kicker;a.position.set(sign*.34,1.81,0);ell('sleeve',sign*.04,-.14,0,.13,.20,.14,navy,a);ell('forearm',sign*.055,-.44,0,.088,.23,.09,skin,a);ell('hand',sign*.055,-.65,0,.09,.1,.075,skin,a);arms.push(a);
const leg=new B.TransformNode('leg',scene);leg.parent=kicker;leg.position.set(sign*.17,.96,0);ell('short',0,-.13,0,.15,.22,.15,shorts,leg);ell('thigh',0,-.38,0,.115,.24,.11,skin,leg);ell('shin',0,-.7,0,.095,.24,.095,sock,leg);ell('boot',0,-.91,-.09,.13,.095,.23,shoe,leg);legs.push(leg)}
const goalie=new B.TransformNode('keeper',scene);goalie.position.set(0,0,goalZ+.55);ell('keeper torso',0,1.48,0,.30,.43,.19,teal,goalie);ell('keeper head',0,2.19,0,.19,.23,.17,skin,goalie);ell('keeper hair',0,2.37,0,.19,.065,.17,hair,goalie);
for(const sign of [-1,1]){ell('keeper arm',sign*.43,1.58,0,.13,.34,.12,teal,goalie);ell('keeper glove',sign*.65,1.45,0,.13,.11,.1,white,goalie);ell('keeper leg',sign*.16,.6,0,.12,.42,.12,dark,goalie)}
const ballMat=material('yellow ball','#edcc39',.42),ball=B.MeshBuilder.CreateSphere('ball',{diameter:.45,segments:24},scene);ball.material=ballMat;
const start=new B.Vector3(0,.24,3.5);ball.position.copyFrom(start);
const score=document.getElementById('score'),round=document.getElementById('round'),message=document.getElementById('message'),buttons=[...document.querySelectorAll('[data-zone]')],restart=document.getElementById('restart');
const zones=[[-2.45,2.15],[2.45,2.15],[-2.45,.55],[2.45,.55],[0,1.35]];
let player=0,cpu=0,kicks=0,saves=0,turn='kick',busy=false,anim=null;
function update(){score.textContent='VOCÊ '+player+' × '+cpu+' CPU';round.textContent='Rodada '+(Math.min(5,Math.max(kicks,saves)+1))+' de 5';message.textContent=turn==='kick'?'Sua vez de CHUTAR!':'Sua vez de DEFENDER!'}
function fire(index){if(busy)return;busy=true;const shot=turn==='kick'?index:Math.floor(Math.random()*5),def=turn==='save'?index:Math.floor(Math.random()*5);anim={time:performance.now(),shot,def,success:shot!==def,scored:false};message.textContent=turn==='kick'?'⚽ Chutando...':'🧤 Defendendo...'}
buttons.forEach(b=>b.addEventListener('click',()=>fire(Number(b.dataset.zone))));
function reset(){ball.position.copyFrom(start);kicker.position.set(-.75,0,5.9);legs.forEach(l=>l.rotation.x=0);arms.forEach(a=>a.rotation.x=0);goalie.position.set(0,0,goalZ+.55);goalie.rotation.z=0}
function finish(){busy=true;buttons.forEach(b=>b.disabled=true);message.textContent=player>cpu?'🏆 VOCÊ VENCEU!':player<cpu?'CPU VENCEU!':'🤝 EMPATE!';round.textContent='Fim da partida';restart.style.display='block'}
function next(){if(turn==='kick'){kicks++;turn='save'}else{saves++;turn='kick'}reset();if((kicks===5&&saves===5)||player>cpu+5-saves||cpu>player+5-kicks){finish();return}busy=false;update()}
restart.addEventListener('click',()=>{player=cpu=kicks=saves=0;turn='kick';busy=false;anim=null;buttons.forEach(b=>b.disabled=false);restart.style.display='none';reset();update()});
engine.runRenderLoop(()=>{if(anim){const p=Math.min(1,(performance.now()-anim.time)/1850),run=Math.min(1,p/.32),stride=Math.sin(run*15)*.5;kicker.position.z=5.9-run*2.2;kicker.position.x=-.75+run*.5;legs[0].rotation.x=stride;legs[1].rotation.x=-stride;arms[0].rotation.x=-stride*.6;arms[1].rotation.x=stride*.6;const flight=Math.max(0,Math.min(1,(p-.32)/.49)),e=1-Math.pow(1-flight,2),target=zones[anim.shot];ball.position.set(target[0]*e,.24+(target[1]-.24)*e+Math.sin(Math.PI*flight)*.8,3.5+(goalZ-3.5)*e);ball.rotation.x+=.09;const dp=Math.max(0,Math.min(1,(p-.12)/.6)),def=zones[anim.def];goalie.position.x=def[0]*dp*.8;goalie.position.y=Math.sin(dp*Math.PI*.8)*.35;goalie.rotation.z=-Math.sign(def[0])*.5*dp;if(p>.84&&!anim.scored){anim.scored=true;if(anim.success){if(turn==='kick')player++;else cpu++}score.textContent='VOCÊ '+player+' × '+cpu+' CPU';message.textContent=anim.success?'⚽ GOOOL!':'🧤 DEFENDEU!'}if(p>=1){anim=null;setTimeout(next,650)}}scene.render()});
window.addEventListener('resize',()=>engine.resize());update();loading.classList.add('hidden');
}catch(e){console.error(e);fail(e)}
})();
</script></body></html>
